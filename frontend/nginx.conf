# Static dashboard plus a same-origin reverse proxy to the API, so the browser never makes a cross-origin call and
# the API needs no CORS. Only the API paths the dashboard uses are forwarded: /docs, /openapi.json and /metrics are not.
# The API address is looked up at request time (Docker's embedded DNS at 127.0.0.11), not once at start-up. Otherwise a
# recreated API container, which gets a new IP during every deployment, would leave nginx proxying to a dead address
# until nginx itself was restarted. Outside Docker, set `resolver` to your DNS server.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    set $api_upstream http://api:8000;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 128k;

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    location ~ ^/(auth|evaluations|repositories|debug)(/|$) {
        proxy_pass $api_upstream;   # a variable with no path: the original URI and query are forwarded unchanged
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not choose its own rate-limit identity.
        # Behind a TLS proxy, trust ITS address with set_real_ip_from/real_ip_header (see docs/deployment.md).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;   # a patch verification request can run for minutes
        proxy_hide_header X-Powered-By;
    }

    location = /ready { proxy_pass $api_upstream; proxy_set_header X-Request-ID $request_id; }
    location = /health { proxy_pass $api_upstream; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
