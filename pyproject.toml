[project]
name = "atlas-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "neo4j>=6.4.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "ruff>=0.17.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "neo4j: needs a running Neo4j (docker compose up -d neo4j)",
    "real_auth: runs with real authentication instead of the default operator override",
    "worker_host: validates a worker host (rootless daemon, limits, escape containment); needs ATLAS_WORKER_VALIDATION=1",
    "slow: starts extra containers and takes a minute or more",
    "container: needs Docker and the atlas-ai-test-runner image (docker/test-runner.Dockerfile)",
]

[tool.ruff]
# Deliberately buggy benchmark repositories. A lint hint there would leak the answer.
extend-exclude = ["benchmarks/bug_*"]

[tool.ruff.lint]
# flake8-bandit security rules on the application code. Each ignore below was audited, not silenced for convenience.
extend-select = ["S"]
ignore = [
    "S101",  # assert: three internal invariants in the graph builder, not input validation
    "S603",  # subprocess with an argument LIST and no shell: git, docker, pytest, ruff, pg_dump (reviewed in 15.1)
    "S607",  # partial executable path: PATH is the deployment's, and docker/git are looked up by name on purpose
    "S108",  # "/tmp" strings are paths INSIDE worker containers (tmpfs), not host temp files
]

[tool.ruff.lint.per-file-ignores]
# These f-strings interpolate only the module constant CHUNK_COLUMNS; every value is a bound parameter.
"app/retrieval/*.py" = ["S608"]
# Tests, benchmarks (deliberately buggy fixtures) and scripts use asserts, fake credentials and URLs freely.
"tests/**" = ["S"]
"benchmarks/**" = ["S"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults is the framework's DI pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
