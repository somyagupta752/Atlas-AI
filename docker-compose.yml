services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
      POSTGRES_DB: atlas
    ports:
      # Host port 5433 avoids clashing with other Postgres instances on 5432.
      - "5433:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.15-community
    container_name: atlas-neo4j
    environment:
      NEO4J_AUTH: neo4j/atlas_dev_password
    ports:
      # Host ports 7475/7688 avoid clashing with other Neo4j instances on 7474/7687.
      - "7475:7474"
      - "7688:7687"
    volumes:
      - atlas_neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  atlas_pgdata:
  atlas_neo4jdata:
